    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://amitkum941998_db_user:Navaneet%402341@cluster0.qsqbp5n.mongodb.net/ecommerce?retryWrites=true&w=majority&appName=Cluster0}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_token_key_aura_style_2026}
